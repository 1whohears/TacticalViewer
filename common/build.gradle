import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id "com.gradleup.shadow"
}

architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/tacview.accesswidener")
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    modApi "com.onewhohears.onewholibs:onewholibs-common-${rootProject.minecraft_version}:${rootProject.onewholibs_version}"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))

    modCompileOnly "maven.modrinth:DistantHorizonsApi:${rootProject.distanthorizons_api_version}"

    api "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forgeconfigapiport_version}"
}
